[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jiko-bridge-blend"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["jiko-bridge-client>=1.0.0"]

[tool.hatch.version]
path = "jiko_bridge_blend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["jiko_bridge_blend"]
