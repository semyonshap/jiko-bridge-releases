[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jiko-bundler"
version = "0.1.0"
description = "Build readable, flat Python bundles without runtime loaders."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Semyon Shapoval" }]
dependencies = []

[project.scripts]
jiko-bundle = "jiko_bundler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jiko_bundler"]

