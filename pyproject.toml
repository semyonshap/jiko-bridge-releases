[dependency-groups]
dev = [
  "mypy",
  "pylint",
  "fake-bpy-module-latest",
  "black",
  "isort"
]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true
no_site_packages = true
mypy_path = [
    "packages/jiko-bridge-c4d",
    "packages/jiko-bridge-blend",
    "packages/jiko-bridge-client",
    "packages/jiko-bundler",
]

[[tool.mypy.overrides]]
module = ["c4d", "c4d.*", "maxon", "maxon.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["bpy", "bpy.*", "bmesh", "bmesh.*", "mathutils", "mathutils.*", "addon_utils"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.MASTER]
extension-pkg-whitelist = ["c4d", "maxon"]
ignored-modules = ["c4d", "maxon"]
generated-members = ["c4d.*"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "too-few-public-methods",
    "broad-exception-caught",

    "missing-module-docstring",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-branches",
    "too-many-ancestors",
    # DCC plugins intentionally mirror each other file by file.
    "duplicate-code"
]
