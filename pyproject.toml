[dependency-groups]
dev = [
  "mypy",
  "pylint",
  "fake-bpy-module-latest",
  "build",
  "twine",
  "scriptmerge",
]

[tool.mypy]
ignore_missing_imports = true
show_error_codes = true
pretty = true
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["c4d", "c4d.*", "maxon", "maxon.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.isort]
profile = "black"
known_first_party = ["src", "jiko_bridge_c4d", "jiko_bridge_client"]
line_length = 100

[tool.pylint.MASTER]
extension-pkg-whitelist = ["c4d", "maxon"]
ignored-modules = ["c4d", "maxon"]
generated-members = ["c4d.*"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "too-few-public-methods",
    "broad-exception-caught",

    "missing-module-docstring",
    "too-many-arguments",
    "too-many-positional-arguments"
]
